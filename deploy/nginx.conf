server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # En-têtes absents d'un simple serveur statique (CSP meta complétée ici côté HTTP).
    # Attention nginx : tout `add_header` dans un `location` annule l'héritage de ceux du
    # `server`. On n'utilise donc que `expires` dans les locations, jamais `add_header`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; object-src 'none'" always;

    # PWA : type MIME du manifest et SW/manifest jamais mis en cache (`expires -1` → no-cache).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    location = /service-worker.js {
        expires -1;
    }

    # Les exports JSON sont gros et régénérés à chaque build : cache court.
    location /data/ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
